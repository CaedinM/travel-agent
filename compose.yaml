services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel_agent
      POSTGRES_PASSWORD: travel_agent_dev
      POSTGRES_DB: travel_agent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_agent -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/mnt/data

  api:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://travel_agent:travel_agent_dev@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
    command: uvicorn travel_agent.api.app:app --app-dir src --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  phoenix_data:
